name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Repository Structure
        run: |
          echo "=== Repository Contents ==="
          ls -la
          find . -maxdepth 3 -not -path '*/.*'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Release APK
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: pubspec.yaml file not found in repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          APK_FILE=$(find . -name "app-release.apk" | head -n 1)
          echo "BUILT_APK_PATH=${PROJECT_DIR}/${APK_FILE#./}" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reels-cropper-release
          path: ${{ env.BUILT_APK_PATH }}
