name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Project and Dependencies
        run: |
          cp lib/main.dart saved_main.dart
          flutter create --org com.reels.cropper --overwrite .
          flutter pub add image_picker gal path_provider video_player
          cp saved_main.dart lib/main.dart
          
          # Android minSdkVersion 21 à°•à°¿ à°¸à±†à°Ÿà± à°šà±‡à°¯à°¡à°‚ (video_player à°•à±‹à°¸à°‚)
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelsCropper-APK
          path: build/app/outputs/flutter-apk/app-release.apk
