name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Project Files and Build APK
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: pubspec.yaml file not found in repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Re-create missing android directory if absent
          if [ ! -d "android" ] || [ ! -f "android/app/build.gradle" ]; then
            echo "Repairing and generating missing Android platform files..."
            flutter create . --platforms=android --org=com.reels.cropper
          fi

          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
          APK_FILE=$(find build/app/outputs/flutter-apk/ -name "app-release.apk" | head -n 1)
          echo "BUILT_APK_PATH=${PROJECT_DIR}/${APK_FILE}" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reels-cropper-release
          path: ${{ env.BUILT_APK_PATH }}
