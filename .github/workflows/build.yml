YAML
name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create Flutter Project Structure
      run: |
        flutter create --org com.reels.cropper .
        flutter pub add image_picker video_player ffmpeg_kit_flutter_min_gpl gallery_saver

    - name: Build APK
      run: flutter build apk --release --split-per-abi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ReelsCropper-APK
        path: build/app/outputs/flutter-apk/app-arm64-v8a
