name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Files & Set App Name
        run: |
          # 1. Android platform files ని క్లీన్‌గా రీ-క్రియేట్ చేస్తుంది
          flutter create --platforms=android --org=com.reels.cropper .
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle 2>/dev/null || true

          # 2. యాప్ డిస్‌ప్లే పేరును "Reels Cropper Pro" గా సెట్ చేస్తుంది
          sed -i 's/android:label="[^"]*"/android:label="Reels Cropper Pro"/' android/app/src/main/AndroidManifest.xml

          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reels-cropper-pro-release
          path: build/app/outputs/flutter-apk/app-release.apk
