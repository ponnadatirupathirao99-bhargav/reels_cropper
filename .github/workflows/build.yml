name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Files and Build APK
        run: |
          # మిస్ అయిన android డైరెక్టరీని రీ-జనరేట్ చేస్తుంది
          flutter create --platforms=android .
          
          # android/app/build.gradle లో minSdkVersion 21 ఉండేలా చూస్తుంది (వీడియో ప్లేయర్ కోసం)
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle 2>/dev/null || true
          
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reels-cropper-release
          path: build/app/outputs/flutter-apk/app-release.apk
